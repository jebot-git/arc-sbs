[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-sbs"
version = "0.2.0"
description = "Independent Intel Arc / OpenVINO 2D-to-SBS video prototype"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.1,<3", "opencv-python-headless>=4.10,<6", "openvino>=2025.4,<2027", "pyopencl>=2025.2,<2027"]

[project.optional-dependencies]
export = ["torch>=2.5,<3", "transformers>=4.48,<6", "huggingface-hub>=0.28,<3"]
dev = ["pytest>=8,<10"]
gui = ["PySide6-Essentials>=6.8,<7"]

[project.scripts]
arc-sbs = "arc_sbs.cli:main"
arc-sbs-gui = "arc_sbs.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
